<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ecdf">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f4ede0'/%3E%3Crect x='9' y='9' width='46' height='46' fill='%23982f26'/%3E%3Crect x='17' y='17' width='30' height='30' fill='none' stroke='%23f4ede0' stroke-width='2'/%3E%3C/svg%3E">
<title>灵魂图鉴 · 测测你的灵魂对应哪位中国历史人物</title>
<meta name="description" content="40 道生活化选择题，8 个维度，14 位中国历史人物。不是历史考试，只是一次照见自己的趣味测试。">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* ========== 基础 ========== */
:root{
  --ink:#211c16;
  --ink2:#4b4438;
  --mute:#8a7f6e;
  --paper:#f4ede0;
  --paper2:#efe5d1;
  --gold:#b8955c;
  --gold-l:#d9c49b;
  --red:#982f26;
  --red-d:#7d251e;
  --line:rgba(92,76,52,.16);
  --line-s:rgba(92,76,52,.09);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --max:760px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;color:var(--ink);font-family:var(--sans);font-weight:400;
  background-color:var(--paper);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%}
button{font-family:inherit;color:inherit}

/* 纸纹 + 金线画框 */
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.70), transparent 46%),
    radial-gradient(ellipse at 82% 88%, rgba(184,149,92,.16), transparent 52%),
    radial-gradient(ellipse at 50% 50%, rgba(255,250,240,.30), transparent 72%),
    repeating-linear-gradient(92deg, rgba(120,98,66,.026) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 30% 20%, rgba(120,98,66,.09) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(120,98,66,.07) 0 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 100% 100%, auto, 120px 120px, 160px 160px;
}
body::after{
  content:"";position:fixed;inset:12px;z-index:60;pointer-events:none;
  border:1px solid rgba(184,149,92,.34);
}
body::before{
  content:"";position:fixed;inset:17px;z-index:60;pointer-events:none;
  border:1px solid rgba(184,149,92,.14);
}
@media(max-width:600px){
  body::after{inset:7px}
  body::before{inset:11px}
}

/* ========== 视图容器 ========== */
.view{display:none;position:relative;z-index:2}
.view.active{display:block;animation:viewIn .5s cubic-bezier(.22,.7,.25,1) both}
@keyframes viewIn{from{opacity:0}to{opacity:1}}

/* ========== 首页 ========== */
.home-inner{
  max-width:var(--max);margin:0 auto;min-height:100dvh;
  padding:clamp(38px,7vh,72px) clamp(24px,6vw,48px) 34px;
  display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
}
.home-mid{
  width:100%;margin:auto 0;padding:18px 0 10px;
  display:flex;flex-direction:column;align-items:center;
}
.brand{
  display:flex;align-items:center;gap:14px;
  font-family:var(--serif);font-size:12px;letter-spacing:.42em;color:var(--mute);text-indent:.42em;
  margin-bottom:clamp(30px,6vh,54px);
}
.brand i{display:block;width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
.brand i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.hero{position:relative;width:100%}
.big-char{
  position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:min(46vw,400px);line-height:1;font-weight:900;
  color:rgba(60,50,36,.033);pointer-events:none;user-select:none;z-index:-1;
}
.kicker{
  font-family:var(--serif);font-size:11px;letter-spacing:.46em;color:var(--gold);
  margin:0 0 20px;text-indent:.46em;
}
h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(31px,7.6vw,55px);
  line-height:1.42;letter-spacing:.035em;margin:0 0 26px;color:var(--ink);
}
h1 em{
  font-style:normal;color:var(--red-d);position:relative;display:inline-block;
}
h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;
  background:linear-gradient(90deg,rgba(184,149,92,0),rgba(184,149,92,.55),rgba(184,149,92,0));
  border-radius:50%;opacity:.7;
}
.lead{
  font-size:clamp(14px,3.5vw,15.5px);line-height:2.05;color:var(--ink2);margin:0 auto 34px;
  max-width:22em;letter-spacing:.03em;
}
.lead b{font-weight:500;color:var(--ink)}

.btn-main{
  position:relative;border:none;cursor:pointer;
  font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.34em;text-indent:.34em;
  color:#f7f1e4;background:var(--ink);
  padding:17px 46px;border-radius:2px;
  box-shadow:0 14px 30px rgba(33,28,22,.20),0 2px 0 rgba(255,255,255,.18) inset;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s,background .3s;
}
.btn-main::after{
  content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.20);pointer-events:none;
}
.btn-main:hover{background:#33291f;transform:translateY(-2px);box-shadow:0 20px 36px rgba(33,28,22,.26)}
.btn-main:active{transform:translateY(0) scale(.985)}
.start-note{display:block;margin-top:14px;font-size:11px;letter-spacing:.22em;color:var(--mute)}
.meta-row{
  display:flex;align-items:center;gap:14px;margin-top:clamp(34px,6vh,50px);
  font-size:12px;letter-spacing:.18em;color:var(--mute);
}
.meta-row span{white-space:nowrap}
.meta-row i{display:block;width:1px;height:11px;background:var(--line)}
.cats{
  display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin-top:18px;
  font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:rgba(75,68,56,.72);
}
.cats span{padding:2px 10px;position:relative}
.cats span + span::before{
  content:"·";position:absolute;left:-2px;color:var(--gold);opacity:.7;
}
.disclaimer{
  margin-top:14px;padding-top:10px;font-size:11px;line-height:1.9;color:rgba(138,127,110,.82);
  letter-spacing:.06em;max-width:26em;
}
.seal-hero{
  position:absolute;right:-2px;top:-60px;z-index:3;
  width:58px;padding:8px 6px;border:2px solid var(--red);
  color:var(--red);font-family:var(--serif);font-size:12.5px;line-height:1.34;
  writing-mode:vertical-rl;letter-spacing:.16em;text-align:center;
  background:rgba(255,255,255,.10);
  transform:rotate(4deg);opacity:.9;
  animation:sealIn .7s .25s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes sealIn{
  0%{opacity:0;transform:scale(1.7) rotate(-8deg)}
  60%{opacity:1;transform:scale(.96) rotate(5deg)}
  100%{opacity:.9;transform:scale(1) rotate(4deg)}
}
@media(max-width:520px){ .seal-hero{width:52px;font-size:12px;top:-20px;right:0} }

/* ========== 答题页 ========== */
.quiz-inner{
  max-width:var(--max);margin:0 auto;min-height:100dvh;
  padding:clamp(22px,4vh,36px) clamp(20px,5vw,40px) 26px;
  display:flex;flex-direction:column;
}
.quiz-panel{width:100%;position:relative;flex:1;display:flex;flex-direction:column}
@media(min-width:680px){
  .quiz-inner{justify-content:center}
  .quiz-panel{
    flex:0 0 auto;max-width:640px;margin:0 auto;padding:34px 38px 28px;
    background:linear-gradient(158deg,rgba(255,253,247,.78),rgba(247,238,222,.62));
    border:1px solid rgba(184,149,92,.34);
    box-shadow:0 20px 60px rgba(70,52,30,.09), 0 1px 0 rgba(255,255,255,.7) inset;
  }
  .quiz-panel::before{
    content:"";position:absolute;inset:6px;border:1px solid rgba(184,149,92,.16);pointer-events:none;
  }
  .quiz-head,.progress,.q-slot,.quiz-foot{position:relative;z-index:1}
}
.quiz-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}
.cat-tag{
  font-family:var(--serif);font-size:12px;letter-spacing:.28em;color:var(--ink2);
  border:1px solid var(--line);background:rgba(255,255,255,.42);
  padding:5px 11px 5px 13px;border-radius:2px;text-indent:.28em;
}
.counter{font-family:var(--serif);font-size:12px;color:var(--mute);letter-spacing:.12em;white-space:nowrap}
.counter b{font-size:24px;font-weight:600;color:var(--ink);margin-right:5px;letter-spacing:.02em}
.progress{position:relative;height:3px;background:rgba(92,76,52,.13);border-radius:3px;overflow:hidden}
.progress-fill{
  height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--red),#c08a55 55%,var(--gold-l));
  transition:width .5s cubic-bezier(.35,.8,.3,1);
  position:relative;
}
.progress-fill::after{
  content:"";position:absolute;right:0;top:-2px;width:6px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 8px rgba(184,149,92,.7);
}
.q-slot{
  margin-top:clamp(24px,5vh,46px);display:flex;flex-direction:column;
  padding:0;
}
.q-card{animation:qIn .45s cubic-bezier(.25,.8,.3,1) both}
@keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.q-index{
  font-family:var(--serif);font-size:11px;letter-spacing:.4em;color:var(--gold);
  margin:0 0 15px;text-indent:.4em;
}
.q-text{
  font-family:var(--serif);font-weight:600;font-size:clamp(21px,4.8vw,28px);
  line-height:1.56;letter-spacing:.015em;margin:0 0 clamp(22px,4.5vh,32px);color:var(--ink);
}
.options{display:flex;flex-direction:column;gap:11px;list-style:none;margin:0;padding:0}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 15px;border:1px solid var(--line);border-radius:3px;
  background:rgba(255,255,255,.52);
  font-family:var(--sans);font-size:clamp(14px,3.6vw,15.5px);line-height:1.62;color:var(--ink2);
  cursor:pointer;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s;
  animation:optIn .45s cubic-bezier(.25,.8,.3,1) both;
  -webkit-user-select:none;user-select:none;
}
@keyframes optIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt:hover{border-color:rgba(184,149,92,.65);background:rgba(255,255,255,.86);transform:translateX(3px);box-shadow:0 6px 18px rgba(70,55,35,.07)}
.opt:active{transform:scale(.994)}
.opt .mark{
  flex:none;width:31px;height:31px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--mute);
  font-family:var(--serif);font-size:13px;letter-spacing:0;
  transition:background .2s,color .2s,border-color .2s;
}
.opt .txt{flex:1}
.opt.sel{border-color:var(--red);background:rgba(152,47,38,.055);color:var(--ink)}
.opt.sel .mark{background:var(--red);border-color:var(--red);color:#fff8ee}
.opt.dim{opacity:.42}
.quiz-foot{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:clamp(26px,5vh,44px);padding-top:0;
}
.btn-ghost{
  border:1px solid var(--line);background:transparent;color:var(--ink2);
  font-size:12px;letter-spacing:.16em;padding:8px 14px;border-radius:2px;cursor:pointer;
  transition:.2s;
}
.btn-ghost:hover{border-color:var(--gold);color:var(--ink);background:rgba(255,255,255,.5)}
.btn-ghost:disabled{opacity:.28;cursor:default}
.quiz-hint{font-size:11px;letter-spacing:.14em;color:var(--mute);text-align:right;line-height:1.8}

/* ========== 排盘 ========== */
.loading-inner{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;
}
.load-seal{
  position:relative;width:96px;height:96px;margin-bottom:30px;
}
.load-seal::before,.load-seal::after{
  content:"";position:absolute;inset:-11px;border:1px dashed rgba(184,149,92,.5);
  border-radius:50%;animation:spin 9s linear infinite;
}
.load-seal::after{inset:-21px;border-color:rgba(184,149,92,.26);animation-direction:reverse;animation-duration:14s}
@keyframes spin{to{transform:rotate(360deg)}}
.load-seal span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--red);color:var(--red);
  font-family:var(--serif);font-size:26px;letter-spacing:.12em;
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.load-title{font-family:var(--serif);font-size:17px;letter-spacing:.3em;margin:0 0 12px;text-indent:.3em}
.load-step{font-size:12px;letter-spacing:.22em;color:var(--mute);height:18px}

/* ========== 结果页 ========== */
.result-inner{
  max-width:var(--max);margin:0 auto;
  padding:clamp(24px,5vh,44px) clamp(16px,4vw,32px) 40px;
}
.soul-card{
  position:relative;overflow:hidden;
  max-width:560px;margin:0 auto;
  background:linear-gradient(155deg,#fdf8ec 0%,#f8f0df 46%,#f2e7d2 100%);
  border:1px solid rgba(184,149,92,.52);
  box-shadow:0 20px 60px rgba(62,46,26,.13),0 2px 0 rgba(255,255,255,.6) inset;
  padding:clamp(20px,4.6vw,34px) clamp(18px,4.6vw,34px) 22px;
  animation:cardIn .75s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.soul-card::before{
  content:"";position:absolute;inset:7px;border:1px solid rgba(184,149,92,.26);pointer-events:none;
}
.soul-card::after{
  content:"";position:absolute;left:-30%;top:-40%;width:70%;height:80%;
  background:radial-gradient(ellipse,rgba(255,255,255,.5),transparent 65%);
  pointer-events:none;
}
.corner{position:absolute;width:16px;height:16px;pointer-events:none;z-index:2}
.corner.tl{top:13px;left:13px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner.tr{top:13px;right:13px;border-top:1px solid var(--gold);border-right:1px solid var(--gold)}
.corner.bl{bottom:13px;left:13px;border-bottom:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner.br{bottom:13px;right:13px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--serif);font-size:10px;letter-spacing:.34em;color:var(--mute);text-indent:.34em;
  position:relative;z-index:1;
}
.card-head .no{letter-spacing:.1em;color:rgba(138,127,110,.85);text-indent:0}
.watermark{
  position:absolute;right:6%;bottom:4%;font-family:var(--serif);font-weight:900;
  font-size:clamp(90px,26vw,150px);line-height:1;color:rgba(60,50,36,.05);
  pointer-events:none;user-select:none;z-index:0;
}
.ring-wrap{position:relative;width:118px;height:118px;margin:14px auto 6px;z-index:1}
.ring{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:rgba(92,76,52,.13);stroke-width:2}
.ring-fg{fill:none;stroke-width:2.4;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1);
  transform:rotate(-90deg);transform-origin:60px 60px}
.ring-txt{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--serif);color:var(--ink);
}
.ring-txt b{font-size:30px;line-height:1;font-weight:600;letter-spacing:.02em}
.ring-txt b i{font-style:normal;font-size:13px;color:var(--mute);margin-left:2px}
.ring-txt span{font-size:10px;letter-spacing:.26em;color:var(--mute);margin-top:7px;text-indent:.26em}
.name-block{text-align:center;position:relative;z-index:1;margin-top:10px}
.p-cat{
  display:inline-block;font-family:var(--serif);font-size:11px;letter-spacing:.34em;text-indent:.34em;
  color:var(--red);border-bottom:1px solid rgba(152,47,38,.3);padding-bottom:3px;margin-bottom:12px;
}
.p-name{
  font-family:var(--serif);font-size:clamp(38px,10vw,54px);font-weight:700;
  letter-spacing:.1em;text-indent:.1em;line-height:1.1;margin:0 0 10px;color:var(--ink);
  text-shadow:0 2px 0 rgba(255,255,255,.5);
}
.p-sub{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:var(--mute);margin:0}
.p-seal{
  position:absolute;right:2px;top:6px;width:46px;padding:8px 6px;
  border:2px solid var(--red);color:var(--red);
  font-family:var(--serif);font-size:13px;line-height:1.25;writing-mode:vertical-rl;
  letter-spacing:.12em;text-align:center;transform:rotate(5deg);opacity:.92;
  animation:sealIn .8s .5s cubic-bezier(.2,.9,.3,1) both;
}
.p-quote{
  position:relative;z-index:1;margin:26px auto 0;max-width:21em;
  font-family:var(--serif);font-size:clamp(17px,4.3vw,21px);line-height:1.95;
  color:var(--ink);letter-spacing:.05em;text-align:center;
}
.p-quote .q-mark{color:var(--gold);font-size:.9em;margin:0 .15em}
.p-tags{
  position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  margin:20px 0 0;
}
.p-tags span{
  font-size:11px;letter-spacing:.16em;color:var(--ink2);
  border:1px solid var(--line);background:rgba(255,255,255,.5);
  padding:5px 11px;border-radius:2px;
}
.card-divider{
  position:relative;height:1px;margin:22px 6px 14px;z-index:1;
  background:linear-gradient(90deg,transparent,rgba(184,149,92,.5),transparent);
}
.card-divider::after{
  content:"❖";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  font-size:9px;color:var(--gold);background:#f8f0df;padding:0 6px;line-height:1;
}
.card-foot{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
  font-family:var(--serif);font-size:10px;letter-spacing:.28em;color:var(--mute);text-indent:.28em;
}
.shot-tip{
  margin:12px 0 0;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--mute);
}
.shot-tip i{font-style:normal;color:var(--gold)}

/* 详情 */
.detail,.actions,.shot-tip,.result-foot{max-width:560px;margin-left:auto;margin-right:auto}
.detail{margin-top:8px}
.section{
  margin-top:30px;animation:fadeUp .55s both;
}
.section h3{
  display:flex;align-items:center;gap:10px;
  font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.14em;
  margin:0 0 12px;color:var(--ink);
}
.section h3 .ch{
  width:25px;height:25px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(152,47,38,.45);color:var(--red);
  font-size:12px;letter-spacing:0;background:rgba(152,47,38,.045);
}
.section p{margin:0;font-size:14.5px;line-height:2.05;color:var(--ink2);letter-spacing:.02em;text-align:justify}
.section p + p{margin-top:12px}
.section .meta-line{
  font-size:12px;letter-spacing:.1em;color:var(--mute);margin-bottom:12px;
}
.dims-wrap{display:grid;grid-template-columns:1fr;gap:9px;margin-top:4px}
@media(min-width:640px){ .dims-wrap{grid-template-columns:1fr 1fr;column-gap:30px} }
.dim-row{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:10px}
.dim-label{font-family:var(--serif);font-size:13px;color:var(--ink2);letter-spacing:.08em}
.dim-label b{font-weight:600;color:var(--ink);font-size:14px;margin-right:4px}
.dim-track{height:5px;border-radius:3px;background:rgba(92,76,52,.10);overflow:hidden}
.dim-fill{height:100%;width:0;border-radius:3px;transition:width 1s cubic-bezier(.2,.7,.2,1)}

.actions{display:flex;flex-direction:column;gap:12px;margin-top:36px}

  position:relative;border:none;cursor:pointer;width:100%;

  font-size:15px;letter-spacing:.24em;text-indent:.24em;padding:15px;border-radius:2px;

.btn-primary::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.16);pointer-events:none}
.btn-primary:hover{background:#33291f;transform:translateY(-1px)}

.btn-row{display:flex;gap:10px}
.btn-row .btn-ghost{flex:1;padding:12px;font-size:12.5px}
.btn-text{
  border:none;background:none;color:var(--mute);font-size:11.5px;letter-spacing:.18em;
  padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:rgba(138,127,110,.35);
}
.btn-text:hover{color:var(--ink2)}
.result-foot{
  margin-top:26px;text-align:center;font-size:10.5px;line-height:1.9;color:rgba(138,127,110,.85);
  letter-spacing:.05em;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 复制提示 */
.toast{
  position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);z-index:80;

}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 桌面侧注 */
.side-note{
  position:fixed;left:22px;top:50%;transform:translateY(-50%);

   计分：题库标准化 → 性格轮廓相关系数
   1) 用题库本身的期望值抹平出题偏好
   2) 用题库标准差把每个维度换算成可比的 z 值
   3) 与人物轮廓做相关系数匹配，并给"主导维度"一点加权
   ============================================================ */

const BANK = (() => {
  const out = {};
  DIMS.forEach(d => {
    let mean = 0, variance = 0;
    QUESTIONS.forEach(q => {
      const ws = q.o.map(o => o[1][d.key] || 0);
      const m = ws.reduce((a, b) => a + b, 0) / 4;
      mean += m;
      variance += ws.reduce((a, b) => a + (b - m) * (b - m), 0) / 4;
    });
    out[d.key] = { mean, sd: Math.sqrt(variance) || 1 };
  });
  return out;
})();

const PERSONA_PROFILES = PERSONAS.map(p => {
  const vals = DIMS.map(d => p.v[d.key] || 0);
  const mean = vals.reduce((a, b) => a + b, 0) / DIMS.length;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / DIMS.length) || 1;
  const z = {};
  DIMS.forEach((d, i) => { z[d.key] = (vals[i] - mean) / sd; });
  const dom = DIMS.slice().sort((a, b) => (p.v[b.key] || 0) - (p.v[a.key] || 0));
  return { p, z, dom };
});

function computeProfile(answers) {
  const raw = {};
  DIMS.forEach(d => { raw[d.key] = 0; });
  answers.forEach((optIndex, qi) => {
    const w = QUESTIONS[qi].o[optIndex][1];
    Object.keys(w).forEach(k => { raw[k] += w[k]; });
  });

  const z = {};
  const zvals = [];
  DIMS.forEach(d => {
    z[d.key] = (raw[d.key] - BANK[d.key].mean) / BANK[d.key].sd;
    zvals.push(z[d.key]);
  });
  const zMean = zvals.reduce((a, b) => a + b, 0) / DIMS.length;
  DIMS.forEach(d => { z[d.key] -= zMean; });

  const sorted = DIMS.slice().sort((a, b) => z[b.key] - z[a.key]);

  const zmax = Math.max.apply(null, DIMS.map(d => z[d.key]));
  const zmin = Math.min.apply(null, DIMS.map(d => z[d.key]));
  const bars = {};
  DIMS.forEach(d => {
    bars[d.key] = zmax === zmin ? 55 : Math.round(28 + 72 * (z[d.key] - zmin) / (zmax - zmin));
  });

  return { raw, z, bars, sorted, top: sorted[0], second: sorted[1] };
}

function cosine(a, b) {
  let dot = 0, na = 0, nb = 0;
  DIMS.forEach(d => {
    const x = a[d.key] || 0, y = b[d.key] || 0;
    dot += x * y; na += x * x; nb += y * y;
  });
  if (!na || !nb) return 0;
  return dot / Math.sqrt(na * nb);
}

function matchPersonas(profile) {
  const list = PERSONA_PROFILES.map(({ p, z, dom }) => {
    let cos = cosine(profile.z, z);
    if (dom[0].key === profile.top.key) cos += 0.030;
    else if (dom[1].key === profile.top.key) cos += 0.012;
    if (dom[0].key === profile.second.key) cos += 0.008;
    return { p, cos };
  }).sort((a, b) => b.cos - a.cos);

  list.forEach(item => {
    item.pct = Math.max(55, Math.min(97, Math.round(52 + item.cos * 50)));
  });
  return list;
}


/* ============================================================
   灵魂图鉴 · 交互
   ============================================================ */
(function () {
  'use strict';

  const LETTERS = ['甲', '乙', '丙', '丁'];
  const state = { index: 0, answers: new Array(QUESTIONS.length).fill(null), locked: false };
  let lastResult = null;

  const $ = id => document.getElementById(id);
  const views = {
    home: $('view-home'), quiz: $('view-quiz'),
    loading: $('view-loading'), result: $('view-result')
  };

  function show(name) {
    Object.keys(views).forEach(k => views[k].classList.toggle('active', k === name));
    window.scrollTo(0, 0);
  }

  /* ---------------- 首页 ---------------- */
  $('startBtn').addEventListener('click', () => {
    state.index = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.locked = false;
    show('quiz');
    renderQuestion(0);
  });

  /* ---------------- 答题 ---------------- */
  function renderQuestion(i) {
    state.index = i;
    state.locked = false;
    const q = QUESTIONS[i];

    $('catTag').textContent = q.c;
    $('qNow').textContent = String(i + 1).padStart(2, '0');
    const pct = (i + (state.answers[i] !== null ? 1 : 0)) / QUESTIONS.length * 100;
    $('progressFill').style.width = pct + '%';
    $('prevBtn').disabled = i === 0;

    const opts = q.o.map((o, j) => `
      <button class="opt${state.answers[i] === j ? ' sel' : ''}" type="button" data-opt="${j}" style="animation-delay:${60 + j * 55}ms">
        <span class="mark">${LETTERS[j]}</span>
        <span class="txt">${o[0]}</span>
      </button>`).join('');

    $('qSlot').innerHTML = `
      <div class="q-card">
        <p class="q-index">第 ${String(i + 1).padStart(2, '0')} 问</p>
        <h2 class="q-text">${q.q}</h2>
        <div class="options" role="group" aria-label="选项">${opts}</div>
      </div>`;

    $('qSlot').querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => selectOption(Number(btn.dataset.opt)));
    });
  }

  function selectOption(j) {
    if (state.locked) return;
    state.locked = true;
    state.answers[state.index] = j;

    const opts = $('qSlot').querySelectorAll('.opt');
    opts.forEach((el, k) => {
      el.classList.toggle('sel', k === j);
      el.classList.toggle('dim', k !== j);
    });
    $('progressFill').style.width = ((state.index + 1) / QUESTIONS.length * 100) + '%';

    setTimeout(() => {
      if (state.index >= QUESTIONS.length - 1) finish();
      else {
        renderQuestion(state.index + 1);
        $('qSlot').firstElementChild.style.animation = 'qIn .45s cubic-bezier(.25,.8,.3,1) both';
      }
    }, 400);
  }

  $('prevBtn').addEventListener('click', () => {
    if (state.index === 0) return;
    renderQuestion(state.index - 1);
  });

  document.addEventListener('keydown', e => {
    if (!views.quiz.classList.contains('active')) return;
    const idx = ['1', '2', '3', '4'].indexOf(e.key);
    if (idx > -1) { selectOption(idx); return; }
    const letter = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
    if (letter > -1) selectOption(letter);
    if (e.key === 'ArrowLeft' && state.index > 0) renderQuestion(state.index - 1);
  });

  /* ---------------- 排盘 ---------------- */
  function finish() {
    show('loading');
    const steps = ['校对四十年谱', '推演灵魂坐标', '比对十四位古人', '落 印'];
    let k = 0;
    $('loadStep').textContent = steps[0];
    const timer = setInterval(() => {
      k++;
      if (k < steps.length) $('loadStep').textContent = steps[k];
    }, 480);

    setTimeout(() => {
      clearInterval(timer);
      const profile = computeProfile(state.answers);
      const list = matchPersonas(profile);
      lastResult = { profile, list };
      renderResult(profile, list);
      show('result');
      requestAnimationFrame(() => requestAnimationFrame(() => animateResult(list)));
    }, 1950);
  }

  /* ---------------- 结果 ---------------- */
  function renderResult(profile, list) {
    const top = list[0];
    const p = top.p;
    const pct = top.pct;
    const no = String(PERSONAS.indexOf(p) + 1).padStart(2, '0');
    const second = list[1], third = list[2];
    const diff = Math.max(0, top.pct - second.pct);

    const tags = p.tags.map(t => `<span>${t}</span>`).join('');
    const bars = DIMS.map(d => `
      <div class="dim-row">
        <div class="dim-label"><b>${d.ch}</b>${d.name}</div>
        <div class="dim-track"><div class="dim-fill" data-w="${profile.bars[d.key]}" style="background:linear-gradient(90deg,${p.accent},${'#c9a467'})"></div></div>
        <div class="dim-val">${profile.bars[d.key]}</div>
      </div>`).join('');

    const nearItems = [second, third].map(it => `
      <div class="near-item"><b>${it.p.name}</b><span>${it.pct}% · ${it.p.cat}</span></div>`).join('');

    const nearNote = diff <= 3
      ? `你与「${second.p.name}」只差 ${diff} 个百分点。你们像同一条河的两岸——换个心情重测，结果也许会翻盘。`
      : `你和「${second.p.name}」之间还隔着 ${diff} 个百分点。他是你的另一种可能，不是你的答案。`;

    const low1 = profile.sorted[DIMS.length - 1];
    const reason = `你的「${profile.top.name}」和「${profile.second.name}」最突出，「${low1.name}」是你八维里最低的一项——这个形状，最接近${p.name}。${p.reason}`;

    $('resultInner').innerHTML = `
      <article class="soul-card" style="--accent:${p.accent}">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <span class="watermark" aria-hidden="true">${p.mark}</span>

        <div class="card-head">
          <span>靈 魂 圖 鑑 · 本 命</span>
          <span class="no">NO. ${no} / 14</span>
        </div>

        <div class="ring-wrap">
          <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="50"></circle>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="50"
              stroke="${p.accent}" stroke-dasharray="314.16" stroke-dashoffset="314.16"></circle>
          </svg>
          <div class="ring-txt"><b>${pct}<i>%</i></b><span>契合度</span></div>
        </div>

        <div class="name-block">
          <span class="p-cat">${p.cat} · ${p.era}</span>
          <h2 class="p-name">${p.name}</h2>
          <p class="p-sub">${p.zi} · ${p.role}</p>
          <span class="p-seal" aria-hidden="true">本命</span>
        </div>

        <p class="p-quote"><span class="q-mark">「</span>${p.quote}<span class="q-mark">」</span></p>
        <div class="p-tags">${tags}</div>

        <div class="card-divider"></div>
        <div class="card-foot"><span>四十問 · 一照見</span><span>灵魂图鉴</span></div>
      </article>
      <p class="shot-tip"><i>—</i> 截图这张卡，即可分享到小红书 / 朋友圈 <i>—</i></p>

      <div class="detail">
        <section class="section" style="animation-delay:.04s">
          <h3><span class="ch">性</span>性格底色</h3>
          <p>${p.desc}</p>
        </section>

        <section class="section" style="animation-delay:.10s">
          <h3><span class="ch">合</span>为什么是他</h3>
          <p class="meta-line">主导底色：${profile.top.name} · ${profile.second.name}　｜　十四位中与你最接近</p>
          <p>${reason}</p>
        </section>

        <section class="section" style="animation-delay:.16s">
          <h3><span class="ch">藏</span>隐藏优势</h3>
          <p>${p.edge}</p>
        </section>

        <section class="section" style="animation-delay:.22s">
          <h3><span class="ch">拾</span>趣味彩蛋</h3>
          <p>${p.egg}</p>
        </section>

        <section class="section" style="animation-delay:.28s">
          <h3><span class="ch">象</span>灵魂坐标</h3>
          <p class="meta-line">八维相对强度，100 = 你最强的那一维</p>
          <div class="dims-wrap">${bars}</div>
        </section>

        <section class="section" style="animation-delay:.34s">
          <h3><span class="ch">近</span>与你擦肩而过</h3>
          <div class="near-list">${nearItems}</div>
          <p class="near-note">${nearNote}</p>
        </section>
      </div>

      <div class="actions">
        <button class="btn-primary" id="copyBtn" type="button">复制我的结果文案</button>
        <div class="btn-row">
          <button class="btn-ghost" id="retryBtn" type="button">重新测一次</button>
          <button class="btn-ghost" id="homeBtn" type="button">回到首页</button>
        </div>
      </div>
      <p class="result-foot">人格测试只是一种叙事方式，不构成历史评价或心理诊断。<br>你比任何一位古人都复杂。</p>
    `;

    $('copyBtn').addEventListener('click', () => copyResult(p, pct));
    $('retryBtn').addEventListener('click', () => {
      state.answers = new Array(QUESTIONS.length).fill(null);
      state.index = 0;
      show('quiz');
      renderQuestion(0);
    });
    $('homeBtn').addEventListener('click', () => show('home'));
  }

  function animateResult(list) {
    const ring = $('ringFg');
    if (ring) {
      const pct = list[0].pct;
      ring.style.strokeDashoffset = String(314.16 * (1 - pct / 100));
    }
    document.querySelectorAll('.dim-fill').forEach((el, i) => {
      el.style.transitionDelay = (0.35 + i * 0.05) + 's';
      requestAnimationFrame(() => { el.style.width = el.dataset.w + '%'; });
    });
  }

  /* ---------------- 分享文案 ---------------- */
  function copyResult(p, pct) {
    const text = '我的灵魂本命是【' + p.name + '】\n「' + p.quote + '」\n契合度 ' + pct +
      '%｜' + p.cat + ' · ' + p.era + '\n—— 灵魂图鉴 · 测测你的灵魂对应哪位中国历史人物';
    const done = () => {
      const toast = $('toast');
      toast.textContent = '文案已复制，去粘贴吧';
      toast.classList.add('on');
      clearTimeout(copyResult._t);
      copyResult._t = setTimeout(() => toast.classList.remove('on'), 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {
      const toast = $('toast');
      toast.textContent = '长按页面可手动复制';
      toast.classList.add('on');
      setTimeout(() => toast.classList.remove('on'), 2200);
    }
    document.body.removeChild(ta);
  }
})();

</script>
